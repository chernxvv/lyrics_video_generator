[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics-video-generator"
version = "0.1.0"
description = "Desktop GUI application for generating lyric videos from audio tracks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Roman Chernov", email = "romanchernovv@gmail.com" },
]
dependencies = [
  "dearpygui>=1.11,<2",
  "Pillow>=10.4,<11",
  "numpy>=2.4,<3",
  "scikit-learn>=1.8,<2",
]

[project.optional-dependencies]
autosync = [
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14",
  "whisperx>=3.8,<4",
  "demucs>=4.0.1,<5",
]

[project.scripts]
lyrics-video-generator = "main:main"
lyrics-video-generator-bootstrap = "bootstrap:main"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "gui_dpg*", "models*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
