[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics-video-generator"
version = "0.1.0"
description = "Desktop GUI application for generating lyric videos from audio tracks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Roman Chernov", email = "romanchernovv@gmail.com" },
]
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
autosync = [
  "librosa>=0.10",
  "soundfile>=0.12",
  "whisperx>=3.1",
  "demucs>=4.0",
]

[project.scripts]
lyrics-video-generator = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "models*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
